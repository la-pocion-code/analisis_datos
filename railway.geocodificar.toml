# Servicio «cron geocodificar» (proyecto keen-wonder), aparte del ETL.
#
# ⚠⚠ ESTE servicio usa ESTE fichero, NO `railway.toml`: aquel arranca `run_dw.py` cada 15 min, y un
# servicio nuevo del mismo repo que lo heredara duplicaría el ETL entero. El servicio tiene
# `railwayConfigFile = railway.geocodificar.toml` y, además, los mismos valores como overrides.
#
# Una vez al día, fuera del tick del ETL (que retiene su advisory lock): geocodifica con Geoapify
# hasta el cupo gratis del día (2.900 de 3.000), por prioridad (recompradores Shopify → Shopify del
# año → el resto). Al llegar al 100 % solo quedan los clientes nuevos (~180/día) y pasa solo a
# mantenimiento. Coste medido/estimado: ~US$0,02/mes (casi todo el tiempo espera la red).
# Las coordenadas llegan al mapa en el siguiente tick :00 del ETL (refresca `mv_clientes_geo_mes`).
[deploy]
startCommand = "python geocodificar_terceros.py --segmento auto"
# 06:00 UTC = 01:00 en Colombia. El cupo de Geoapify y la marca de `etl_control` van por día UTC.
cronSchedule = "0 6 * * *"
restartPolicyType = "NEVER"
